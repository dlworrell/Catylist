name: REA relationship verified publication (bootstrap)
on:
  push:
    branches: [bootstrap/rea-evo-relationship-20261026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'dlworrell/Catylist' && github.actor == 'dlworrell' && github.ref == 'refs/heads/bootstrap/rea-evo-relationship-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish only the content-bound reviewed proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BOOTSTRAP_BRANCH: bootstrap/rea-evo-relationship-20261026
          EXPECTED_PAYLOAD_SHA256: f54c67d94db99cfce343a0cbfda63839f796599505e0721412813c2a4303ed83
          REVIEWED_PAYLOAD_BASE64: 
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import runpy
          import urllib.request
          from pathlib import Path
          source_url = 'https://raw.githubusercontent.com/dlworrell/AEMS/e620f4bd3cc45f05f2f18b61e3a087303eb2b4bd/scripts/publish_reviewed_repair.py'
          with urllib.request.urlopen(source_url, timeout=30) as response:
              source = response.read(1024 * 1024 + 1)
          if len(source) > 1024 * 1024 or hashlib.sha256(source).hexdigest() != '74d3acbd02420652c9a8f953e305ba4919c684646f0ea444815f8b752b23f290':
              raise SystemExit('Pinned publisher identity mismatch')
          publisher = Path('publish_reviewed_repair.py')
          publisher.write_bytes(source)
          runpy.run_path(str(publisher), run_name='__main__')
          PY
