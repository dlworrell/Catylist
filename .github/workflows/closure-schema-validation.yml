name: Closure schema validation

on:
  pull_request:
    paths:
      - "docs/contracts/CAT-CON-001-Engineering-Closure-Metadata-Contract.md"
      - "docs/contracts/CAT-CON-001-Enforcement-Boundary.md"
      - "docs/workstreams/CAT-IMP-001-workstream-continuity.yaml"
      - "schemas/catalyst/engineering-closure-v1.schema.json"
      - "examples/closure/**"
      - "scripts/validate_closure_schema.py"
      - ".github/workflows/closure-schema-validation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/contracts/CAT-CON-001-Engineering-Closure-Metadata-Contract.md"
      - "docs/contracts/CAT-CON-001-Enforcement-Boundary.md"
      - "docs/workstreams/CAT-IMP-001-workstream-continuity.yaml"
      - "schemas/catalyst/engineering-closure-v1.schema.json"
      - "examples/closure/**"
      - "scripts/validate_closure_schema.py"
      - ".github/workflows/closure-schema-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validator
        run: >-
          python -m pip install --disable-pip-version-check
          "jsonschema==4.23.0"
          "rfc3339-validator==0.1.4"

      - name: Validate closure fixtures
        run: python scripts/validate_closure_schema.py
